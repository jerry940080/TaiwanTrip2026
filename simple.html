<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b4c7e">
<title>台灣行程・大字版</title>
<meta name="description" content="2026 台灣十天行程的大字版，一天一頁，只留當天要做的事。">
<style>
/* ===== 大字版：字大、對比高、按鈕大，只為手機設計 =====
   跟 index.html 完全獨立，沒有共用任何程式；資料是人工濃縮過的，
   不是從 DAYS 自動產生——改行程時兩邊都要改，tools/check.py 會對照提醒。 */
:root{
  --paper:#f8f5ee; --card:#fffdf8; --ink:#1a1a1a; --ink2:#3d4046;
  --blue:#24456f; --red:#b93d28; --green:#1f6b45; --rule:#ddd6c8;
  --base:21px;                       /* 由「字體大小」按鈕改寫 */
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html{font-size:var(--base)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:1rem;line-height:1.8;letter-spacing:.02em;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
b,strong{font-weight:700}

/* ---------- 頁首 ---------- */
header{background:var(--blue);color:#fff;padding:18px 0 16px}
header h1{margin:0;font-size:1.45rem;line-height:1.4;font-weight:700}
header .sub{margin-top:4px;font-size:.85rem;opacity:.85}

/* ---------- 字體大小 ---------- */
.sizer{display:flex;gap:8px;align-items:center;margin-top:14px}
.sizer span{font-size:.8rem;opacity:.85;flex:none}
.sizer button{
  flex:1;min-height:52px;border:2px solid rgba(255,255,255,.5);background:transparent;
  color:#fff;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;padding:0}
.sizer button[aria-pressed="true"]{background:#fff;color:var(--blue);border-color:#fff}
.sizer button:nth-child(2){font-size:.95rem}
.sizer button:nth-child(3){font-size:1.15rem}
.sizer button:nth-child(4){font-size:1.4rem}

/* ---------- 今天 ---------- */
.today{background:var(--card);border:3px solid var(--red);border-radius:14px;
  padding:16px 18px;margin:18px 0 22px}
.today .lab{font-size:.85rem;color:var(--red);font-weight:700}
.today .big{font-size:1.5rem;font-weight:700;line-height:1.4;margin-top:2px}
.today .go{display:block;margin-top:12px;min-height:60px;line-height:60px;text-align:center;
  background:var(--red);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;font-size:1.05rem}

/* ---------- 每天一列 ---------- */
h2.sec{font-size:1.15rem;margin:26px 0 12px;padding-bottom:8px;border-bottom:3px solid var(--ink)}
a.day{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:2px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px;min-height:60px}
a.day .d,a.day .t,a.day .s{display:block}
a.day .d{font-size:.9rem;color:var(--blue);font-weight:700}
a.day .t{font-size:1.25rem;font-weight:700;line-height:1.45;margin-top:2px}
a.day .s{font-size:.85rem;color:var(--ink2);margin-top:4px}
a.day.rest{border-color:var(--green)}
a.day.rest .d{color:var(--green)}

/* ---------- 一天的內頁 ---------- */
.detail{display:none}
body.on-detail .list{display:none}
body.on-detail .detail{display:block}
.back{display:block;width:100%;min-height:60px;margin:16px 0 18px;border:none;border-radius:10px;
  background:var(--blue);color:#fff;font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.dhead{font-size:1.6rem;font-weight:700;line-height:1.35}
.dhead .dd{display:block;font-size:.95rem;color:var(--blue);font-weight:700}
.stay{background:var(--card);border:2px solid var(--rule);border-left:8px solid var(--red);
  border-radius:12px;padding:12px 16px;margin:16px 0 20px}
.stay .lab{font-size:.8rem;color:var(--ink2)}
.stay .v{font-size:1.2rem;font-weight:700;line-height:1.45}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{background:var(--card);border:2px solid var(--rule);border-radius:12px;
  padding:12px 16px;margin-bottom:12px}
ol.steps .tt{font-size:1.15rem;font-weight:700;color:var(--blue)}
ol.steps .hh{font-size:1.1rem;line-height:1.7;margin-top:2px}
.tip{background:#fff6e8;border:2px solid #e0c48a;border-radius:12px;padding:12px 16px;
  margin-top:18px;font-size:1rem;line-height:1.7}

/* ---------- 常用 ---------- */
.card{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card .lab{font-size:.8rem;color:var(--ink2)}
.card .nm{font-size:1.25rem;font-weight:700;line-height:1.45}
.card .ad{font-size:1.1rem;line-height:1.6;margin-top:4px}
a.tel{display:block;margin-top:10px;min-height:60px;line-height:60px;text-align:center;
  background:var(--green);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;font-size:1.05rem}
footer{margin:32px 0 0;padding-top:18px;border-top:2px solid var(--rule);font-size:.85rem;color:var(--ink2)}
footer a{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>台灣行程・大字版</h1>
    <div class="sub">2026 年 9 月 26 日 – 10 月 5 日<br>十天九夜</div>
    <div class="sizer">
      <span>字體</span>
      <button type="button" data-px="21">大</button>
      <button type="button" data-px="25">更大</button>
      <button type="button" data-px="30">最大</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 行程表 -->
  <div class="list">
    <div class="today" id="today"></div>
    <h2 class="sec">十天行程</h2>
    <div id="daylist"></div>

    <h2 class="sec">住哪裡・打給誰</h2>
    <div id="contacts"></div>

    <footer>
      這是大字版，只留每天要做的事。<br>
      要看地圖、票價、照片與詳細說明 → <a href="index.html">完整版</a>
    </footer>
  </div>

  <!-- 一天的內頁 -->
  <div class="detail">
    <button class="back" type="button" id="back">← 回到十天行程</button>
    <div id="detail"></div>
    <button class="back" type="button" id="back2">← 回到十天行程</button>
  </div>

</main>

<script>
/* ===== 資料：每天最多六句，刻意不寫細節 ===== */
const D=[
 {n:1,date:'9/26',wd:'六',t:'到台北',s:'下午的飛機，晚上就到飯店',stay:'茹曦酒店（台北）',
  steps:[['13:55','北京的飛機起飛'],['17:10','桃園機場落地，領行李'],
   ['18:10','有人開車來接，直接載到飯店（約 1 小時）'],['19:10','飯店放行李'],['20:00','吃晚餐，早點休息']]},
 {n:2,date:'9/27',wd:'日',t:'中正紀念堂・台北 101',s:'都是平地，象山可去可不去',stay:'茹曦酒店（台北）',
  steps:[['09:00','<b>在飯店大廳集合</b>，走 5 分鐘到捷運南京復興站'],
   ['09:20','捷運 5 站到中正紀念堂，中途轉一次車'],
   ['09:45','中正紀念堂散步，園區平坦好走'],
   ['11:30','捷運 5 站到台北 101，<b>不用轉車</b>'],
   ['12:30','<b>在 101 地下美食街吃午餐</b>'],
   ['13:45','四四南村，走路 4 分鐘就到'],
   ['14:30','<b>象山（可去可不去）</b>：石階，走 15–25 分到第一個平台'],
   ['16:00','有人開車來接，回家休息'],['18:30','中秋烤肉、賞月']],
  tip:'<b>象山是選配。</b>前面三個點全是平地；不去象山的話 14:30 就可以回家，多兩小時休息。'},
 {n:3,date:'9/28',wd:'一',t:'故宮・迪化街',s:'全程開車，都是平地',stay:'茹曦酒店（台北）',
  steps:[['09:00','<b>吳老弟開車</b>，飯店出發去故宮，約 20 分'],
   ['09:30','故宮：室內有冷氣，累了有位子坐'],
   ['13:00','<b>大稻埕吃午餐</b>：永樂市場、慈聖宮廟口小吃'],
   ['14:00','迪化街：南北貨老街，<b>要買的東西這天買完</b>'],
   ['16:00','開車回飯店，下午還有時間休息'],
   ['18:30','飯店附近吃晚餐']],
  tip:'<b>今天有車，買的東西直接放後車廂</b>，不用提著走。迪化街是窄巷，車停外面的停車場再走進去。'},
 {n:4,date:'9/29',wd:'二',t:'九份泡茶看夕陽',s:'十點才出門，全程有位子坐',stay:'茹曦酒店（台北）',
  steps:[['10:00','捷運站集合，今天晚一點出門'],['10:30','松山慈祐宮拜媽祖'],
   ['11:30','車站附近吃午餐'],['13:30','搭客運直達九份，約 1 小時 20 分'],
   ['16:00','找一間茶樓坐下來泡茶，等夕陽'],['18:45','搭同一班車回台北，夜市吃小吃'],
   ['22:00','回飯店收行李。<b>吳老弟今晚會來</b>：收走大行李，帶來小行李箱和兩張高鐵票']],
  tip:'今天的重點就是<b>坐在茶樓裡看海等天黑</b>，不用一直走。日落時間 17:44。'},
 {n:5,date:'9/30',wd:'三',t:'日月潭',s:'高鐵轉公車，下午坐船搭纜車',stay:'日月潭鴻賓大飯店',
  steps:[['08:00','高鐵去台中，約 1 小時'],['09:30','轉公車到日月潭，約 2 小時'],
   ['12:00','坐船遊湖，中午吃飯'],['13:30','搭纜車，從空中看整片湖'],
   ['16:30','向山遊客中心走走'],['19:30','回飯店休息']],
  tip:'<b>三天兩夜要帶：</b>小行李箱＋後背包、薄外套（溪頭晚上只有 17 度）、雨傘、手機與充電器、錢包與悠遊卡、護照、牙刷牙膏，餅乾和水在超商買。<br><b>高鐵票由吳老弟訂</b>，9/29 晚上他來收行李時一起拿到。<br>行李到了先寄飯店，玩完再回來住。'},
 {n:6,date:'10/1',wd:'四',t:'溪頭神木',s:'園區裡坐電動車，不用爬坡',stay:'旬日覓覓（溪頭）',
  steps:[['09:00','搭公車去溪頭，約 2 小時'],['11:00','到溪頭，走路 3 分鐘到民宿，先放行李'],
   ['13:30','進園區，坐已經訂好的電動車'],['14:00','看兩千多年的神木'],
   ['14:45','空中走廊，再走到大學池'],['17:00','吃晚餐，回民宿休息']],
  tip:'溪頭在山上，<b>早晚會冷，外套一定要帶</b>。電動車把上坡都跳過了，只走下坡。'},
 {n:7,date:'10/2',wd:'五',t:'回台北',s:'睡飽再走，下午就到飯店',stay:'兄弟大飯店（台北）',
  steps:[['09:30','睡飽再起床，吃民宿早餐'],['11:00','退房，搭公車到台中，約 2 小時'],
   ['13:00','高鐵站吃午餐'],['14:30','高鐵回台北，約 1 小時'],
   ['15:30','<b>今晚起換住兄弟大飯店</b>，捷運南京復興站旁'],
   ['18:00','晚餐：搭捷運到<b>台北車站</b>，樓上吃飯（約 12 分）']],
  tip:'<b>今天從溪頭回台中的車，座位一定要先上網預約</b>（9/27 起才開放）。另外，寄放在家裡的大行李今天拿回來，先跟家人約好送到飯店的時間。'},
 {n:8,date:'10/3',wd:'六',t:'休息日',s:'在家附近走走，兩餐都訂好了',stay:'兄弟大飯店（台北）',rest:1,
  steps:[['整天','<b>不用起床，睡到自然醒。</b>今天不排景點，只有吃飯'],
   ['早上','飯店吃早餐，想回房再睡也可以'],
   ['想出門再說','到家裡附近走走，不趕路也不用查交通'],
   ['午餐','<b>小北平麵食館</b>，已訂位'],
   ['下午','洗衣服、整理行李、睡午覺都好'],
   ['晚餐','<b>大灣碼頭 松隆店</b>（松山高中對面），已訂位'],
   ['晚上','吃完回飯店早點睡——明天晚上有慶生']]},
 {n:9,date:'10/4',wd:'日',t:'龍山寺・慶生',s:'上午出門，下午休息，晚上吃飯',stay:'兄弟大飯店（台北）',
  steps:[['09:30','飯店走 2 分鐘搭捷運去龍山寺'],['10:00','龍山寺拜拜，旁邊就是剝皮寮老街'],
   ['12:00','萬華吃午餐'],['13:30','搭捷運回飯店'],
   ['下午','<b>整個下午休息</b>，順便把行李整理好'],['19:00','慶生晚餐，已經訂位了']],
  tip:'今天排得很輕：<b>中午吃完就回飯店</b>。明天一早要飛，晚上的慶生才是重點。'},
 {n:10,date:'10/5',wd:'一',t:'回北京',s:'中午的飛機',stay:'',
  steps:[['08:30','吃早餐、整理行李'],['09:15','坐車去桃園機場，約 1 小時'],
   ['10:15','報到、託運行李'],['13:15','飛機起飛'],['16:45','到北京']],
  tip:'回程遇上十一長假，機場會排隊，<b>提早三小時到機場</b>比較保險。'}
];

const CONTACTS=[
 {lab:'9/26–9/29 住這裡（可以直接給計程車司機看）',nm:'茹曦酒店 ILLUME TAIPEI',ad:'台北市松山區敦化北路 100 號'},
 {lab:'10/2–10/4 住這裡（可以直接給計程車司機看）',nm:'兄弟大飯店',ad:'台北市南京東路三段・捷運南京復興站旁'},
 {lab:'10/1 住這裡（溪頭）',nm:'旬日覓覓',ad:'南投縣鹿谷鄉興產路 6-12 號・公車站走路 3 分',tel:'0911612158',telLab:'打電話給民宿'},
 {lab:'9/30 住這裡',nm:'日月潭鴻賓大飯店',ad:'南投縣魚池鄉・日月潭水社商圈內'},
 {lab:'10/4 慶生晚餐（已訂位）',nm:'丰禾 台北南京東店',ad:'台北市南京東路二段 146 號 2 樓',tel:'0225076808',telLab:'打電話給餐廳'},
 {lab:'10/1 溪頭園區電動車（已預約）',nm:'溪頭導覽解說電動車',ad:'限 4 人・約 1.5 小時',tel:'0492612210',telLab:'打電話給車行'}
];

/* ===== 字體大小 ===== */
const sizer=document.querySelector('.sizer');
function setPx(px,save){
  document.documentElement.style.setProperty('--base',px+'px');
  sizer.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.px===String(px)));
  if(save){try{localStorage.setItem('bigfont',px);}catch(e){}}
}
sizer.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setPx(+b.dataset.px,1);});
let saved=21; try{saved=+localStorage.getItem('bigfont')||21;}catch(e){}
setPx([21,25,30].includes(saved)?saved:21,0);

/* ===== 今天 ===== */
function dayOf(d){                       // 行程第幾天（1–10），不在行程內回 0
  const base=new Date(2026,8,26);        // 2026-09-26
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const n=Math.round((t-base)/86400000)+1;
  return n>=1&&n<=10?n:0;
}
const now=new Date(), cur=dayOf(now), box=document.getElementById('today');
if(cur){
  const d=D[cur-1];
  box.innerHTML='<div class="lab">今天</div><div class="big">'+d.date+'（'+d.wd+'）'+d.t+'</div>'
   +'<a class="go" href="#d'+d.n+'">看今天要做什麼</a>';
}else{
  const base=new Date(2026,8,26), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const left=Math.round((base-t)/86400000);
  box.innerHTML = left>0
   ? '<div class="lab">還沒出發</div><div class="big">距離出發還有 '+left+' 天</div>'
     +'<a class="go" href="#d1">看第一天要做什麼</a>'
   : '<div class="lab">行程已結束</div><div class="big">歡迎再來台灣</div>';
}

/* ===== 十天列表 ===== */
document.getElementById('daylist').innerHTML=D.map(d=>
 '<a class="day'+(d.rest?' rest':'')+'" href="#d'+d.n+'">'
 +'<span class="d">第 '+d.n+' 天・'+d.date+'（'+d.wd+'）</span>'
 +'<span class="t">'+d.t+'</span>'
 +'<span class="s">'+d.s+'</span></a>').join('');

/* ===== 住哪裡・打給誰 ===== */
document.getElementById('contacts').innerHTML=CONTACTS.map(c=>
 '<div class="card"><div class="lab">'+c.lab+'</div><div class="nm">'+c.nm+'</div>'
 +'<div class="ad">'+c.ad+'</div>'
 +(c.tel?'<a class="tel" href="tel:'+c.tel+'">📞 '+c.telLab+'</a>':'')+'</div>').join('');

/* ===== 內頁：用網址的 #d3 切換，手機的返回鍵才會正常 ===== */
const det=document.getElementById('detail');
function render(){
  const m=/^#d(\d+)$/.exec(location.hash);
  const d=m?D[+m[1]-1]:null;
  if(!d){document.body.classList.remove('on-detail');return;}
  det.innerHTML='<div class="dhead"><span class="dd">第 '+d.n+' 天・'+d.date+'（'+d.wd+'）</span>'+d.t+'</div>'
   +(d.stay?'<div class="stay"><div class="lab">今晚住</div><div class="v">'+d.stay+'</div></div>':'')
   +'<ol class="steps">'+d.steps.map(s=>
     '<li><div class="tt">'+s[0]+'</div><div class="hh">'+s[1]+'</div></li>').join('')+'</ol>'
   +(d.tip?'<div class="tip">'+d.tip+'</div>':'');
  document.body.classList.add('on-detail');
  window.scrollTo(0,0);
}
addEventListener('hashchange',render);
function back(){ if(location.hash){history.back();} else {document.body.classList.remove('on-detail');} }
document.getElementById('back').onclick=back;
document.getElementById('back2').onclick=back;
render();
</script>
</body>
</html>
